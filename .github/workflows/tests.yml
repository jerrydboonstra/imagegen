name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install pillow
      - run: bash tests/box-guarantee.sh
      - run: bash tests/box-guarantee-nopillow.sh
      - run: bash tests/doctor.sh
